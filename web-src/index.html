<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Store</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">
  <div class="auth-container">
    <h1>My Store</h1>

    <div class="tabs">
      <div class="tab active" id="login-tab" onclick="switchTab('login')">Login</div>
      <div class="tab" id="signup-tab" onclick="switchTab('signup')">Sign Up</div>
    </div>

    <!-- Login Form -->
    <div class="form-section active" id="login-section">
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter password" required>
          <div class="field-error" id="login-password-error" style="display:none;"></div>
        </div>
        <button type="submit" id="login-btn">Login</button>
        <div class="message" id="login-message"></div>
      </form>
    </div>

    <!-- Signup Form -->
    <div class="form-section" id="signup-section">
      <form id="signup-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signup-name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="Min 8 characters" required>

          <!-- Strength bar -->
          <div class="strength-wrap">
            <div class="strength-track">
              <div class="strength-fill" id="password-strength-bar"></div>
            </div>
            <span class="strength-label" id="password-strength-text"></span>
          </div>

          <!-- Live rules checklist -->
          <div class="password-rules" id="password-rules"></div>
        </div>

        <!-- Confirm Password field -->
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signup-confirm-password" placeholder="Re-enter password" required>
          <div class="field-error" id="confirm-password-error" style="display:none;"></div>
        </div>
        <button type="submit" id="signup-btn">Create Account</button>
        <div class="message" id="signup-message"></div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>

</html>
